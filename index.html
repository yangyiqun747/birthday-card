<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="伸手聚拢星尘，点亮烛光，再放一场生日烟花。">
  <meta name="theme-color" content="#100d18">
  <title>为你点亮一颗星</title>
  <style>
:root {
  color-scheme: dark;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --ink: #f8edf5;
  --muted: #c5b3cb;
  --gold: #ffdba6;
  --rose: #e6a9d3;
  --edge: #f0c7e32b;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", SimSun, Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-width: 260px;
  min-height: 100vh;
  color: var(--ink);
  background: radial-gradient(ellipse at 82% 33%, #281b38 0, transparent 54%),
    radial-gradient(ellipse at 12% 96%, #21132c, transparent 48%), #100d18;
}
button { font: inherit; }
button:focus-visible, h2:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.shell { width: min(1210px, calc(100% - 86px)); margin: 0 auto; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 23px 0 19px; border-bottom: 1px solid var(--edge);
}
.mark { display: flex; align-items: center; gap: 10px; font-size: .87rem; font-weight: 620; letter-spacing: .16em; }
.seal {
  display: grid; place-items: center; width: 35px; height: 35px; border-radius: 50%; border: 1px solid #eab6dc50;
  background: radial-gradient(ellipse, #704761, #2b1d35); color: #ffdbad; font-size: 1.18rem;
}
.top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 7px 12px; }
.sound-toggle {
  min-height: 40px; padding: 0 11px; cursor: pointer; border: 1px solid var(--edge); border-radius: 999px;
  background: #f8d9ec09; color: var(--muted); font-size: .82rem; white-space: nowrap;
}
.sound-toggle[aria-pressed="true"] { border-color: #ffdba66b; color: var(--gold); }
.sound-toggle:hover { background: #f8d9ec17; }
.camera-badge { display: flex; align-items: center; gap: 8px; margin: 0; font-size: .875rem; color: var(--muted); }
.camera-badge span:first-child { width: 7px; height: 7px; border-radius: 50%; background: #ffd38d; }
.camera-badge[data-status="active"] span:first-child { background: #b6e4bd; box-shadow: 0 0 0 3px #b6e4bd20; }

.card-layout {
  display: grid; grid-template-columns: minmax(0, .65fr) minmax(0, 1.35fr); align-items: center;
  gap: clamp(24px, 5.1vw, 80px); padding: clamp(36px, 6.5vh, 74px) 0 32px;
}
.intro h1 { margin: 0; font: 700 clamp(3.4rem, 6.15vw, 6.1rem)/1.09 var(--serif); letter-spacing: -.07em; overflow-wrap: anywhere; }
.intro h1 em { color: var(--gold); font-style: normal; text-shadow: 0 0 32px #ecad9470; }
.intro-copy { color: var(--muted); font-size: clamp(1rem, 1.46vw, 1.12rem); line-height: 1.74; margin: 19px 0 24px; }

.steps { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 10px; list-style: none; padding: 0; margin: 0 0 14px; color: var(--muted); }
.step { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; }
.step:not(:first-child)::before { content: ""; width: 13px; height: 1px; background: #eeb9d25c; margin-right: 4px; }
.step[aria-current] { color: var(--gold); font-weight: 720; }
.gesture-cue {
  display: flex; align-items: center; gap: 12px; max-width: 345px; text-align: left; padding: 11px 13px;
  margin-bottom: 15px; border: 1px solid var(--edge); border-radius: 14px; background: #fbeaff08;
}
.gesture-icon {
  display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 11px;
  font-size: 1.29rem; background: #f0b0c718; box-shadow: inset 0 0 0 1px #f0b0c71f;
}
.gesture-cue strong { color: #f7e8f4; font-size: .98rem; }
.gesture-cue p { margin: 3px 0 0; color: var(--muted); font-size: .875rem; line-height: 1.44; }
.controls { display: flex; align-items: center; }
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 47px; padding: 0 19px; cursor: pointer;
  border: 1px solid transparent; border-radius: 999px; font-size: .91rem; font-weight: 700; transition: background .16s, transform .16s;
}
.button:active { transform: scale(.98); }
.primary { background: linear-gradient(112deg, #ffe2b8, #f5b0bd); color: #291422; box-shadow: 0 6px 22px #f5b0bd2b; }
.primary:hover { background: #ffdfc1; }
[data-camera-active] .primary { border-color: var(--edge); background: #f7d9ee08; color: var(--ink); box-shadow: none; }
[data-camera-active] .primary:hover { background: #f7d9ee16; }
.camera-icon { display: inline-block; width: 13px; height: 10px; margin-right: 4px; border: 1.5px solid currentColor; position: relative; border-radius: 2px; }
.camera-icon::after { content: ""; position: absolute; right: -5px; top: 1px; width: 4px; height: 5px; background: currentColor; clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 70%); }
.status { color: var(--muted); font-size: .875rem; margin: 10px 0 0; line-height: 1.55; min-height: 2.75em; }

.scene {
  position: relative; isolation: isolate; min-width: 0; overflow: hidden; aspect-ratio: 1.36; min-height: 440px;
  border: 1px solid #f4c7e24a; border-radius: 26px; background:
    radial-gradient(ellipse at 50% 60%, #4a254772 0, #22152b75 35%, transparent 76%),
    radial-gradient(ellipse at 45% 26%, #231a38, #101019 72%);
  box-shadow: 0 26px 65px #05030a84, inset 0 0 55px #08060da6;
}
.scene::after {
  content: ""; position: absolute; inset: 10px; z-index: 1; pointer-events: none; border: 1px solid #f9d8f013; border-radius: 19px;
}
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; }
#particle-scene { touch-action: none; cursor: grab; }
#particle-scene[data-dragging] { cursor: grabbing; }
#particle-scene:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
[data-phase="celebrated"] #particle-scene { touch-action: auto; cursor: default; }
.scene-state, .orbit-hint {
  position: absolute; z-index: 2; top: 18px; max-width: calc(50% - 23px); padding: 6px 10px; pointer-events: none;
  border: 1px solid #ffccdf30; border-radius: 999px; font-size: .82rem; line-height: 1.43; color: #f1d8eb; background: #271b32bb;
}
.scene-state { left: 18px; }
.orbit-hint { right: 18px; color: var(--muted); }
[data-phase="celebrated"] .orbit-hint { display: none; }
.viewfinder {
  overflow: hidden; position: absolute; z-index: 5; right: 17px; bottom: 17px; width: clamp(104px, 24%, 147px);
  border-radius: 12px; background: #261c31; border: 1px solid #f8d5e378; box-shadow: 0 5px 18px #08050c88;
}
.viewfinder video { display: block; width: 100%; aspect-ratio: 4 / 3; background: #362540; object-fit: cover; transform: scaleX(-1); }
.tracking-caption { display: block; color: #fff1f8; text-align: center; font-size: .76rem; padding: 6px 3px; }
.hold-track { height: 3px; background: #f8c1d444; }
#gesture-progress { height: 100%; background: var(--gold); transform: scaleX(0); transform-origin: left center; transition: transform .08s linear; }

.letter {
  position: absolute; z-index: 3; bottom: 8%; left: 50%; width: min(80%, 465px); max-height: 49%; overflow: auto; text-align: center;
  border: 1px solid #f1c3e45e; border-radius: 17px; padding: 13px clamp(11px, 3vw, 30px) 15px; transform: translateX(-50%);
  background: linear-gradient(140deg, #3c2547e8, #20182fe8); box-shadow: 0 12px 45px #0c0615b3; animation: letter-in .85s 2.7s both ease;
}
.letter h2 { color: var(--gold); font: 700 clamp(1.55rem, 3.9vw, 2.75rem)/1.12 var(--serif); margin: 0 0 7px; }
.letter p { color: #f0ddee; font-size: clamp(.84rem, 1.5vw, 1.01rem); line-height: 1.63; margin: 5px 0; overflow-wrap: anywhere; }
.letter .signature { text-align: right; color: var(--rose); }
@keyframes letter-in { from { opacity: 0; transform: translate(-50%, 9px); } to { opacity: 1; transform: translate(-50%, 0); } }

.footnote { display: flex; align-items: center; gap: 7px; border-top: 1px solid var(--edge); padding: 15px 0 20px; color: var(--muted); font-size: .82rem; }
.footnote span { color: var(--rose); }

@media (max-width: 850px) {
  .shell { width: min(575px, calc(100% - 34px)); }
  .topbar { padding: 14px 0; }
  .card-layout { grid-template-columns: minmax(0, 1fr); padding: 20px 0 18px; gap: 12px; }
  .intro { display: contents; }
  .intro h1 { font-size: clamp(2.43rem, 8.3vw, 4.2rem); letter-spacing: -.075em; }
  .intro h1 br { display: none; }
  .intro-copy { margin: -3px 0 0; line-height: 1.55; }
  .scene { order: 1; min-height: 0; aspect-ratio: 1.1; border-radius: 21px; }
  .scene::after { inset: 7px; border-radius: 15px; }
  .steps { order: 2; margin: 0; }
  .gesture-cue { order: 3; max-width: none; margin: 0; }
  .controls { order: 4; }
  .status { order: 5; min-height: 1.5em; margin: -3px 0 0; }
  .scene-state { top: 13px; left: 13px; }
  .orbit-hint { top: 13px; right: 13px; }
  .viewfinder { bottom: 12px; right: 12px; }
  .letter { bottom: 6%; width: 84%; max-height: 54%; }
}
@media (max-width: 390px) {
  .shell { width: calc(100% - 28px); }
  .mark { letter-spacing: .09em; }
  .seal { width: 30px; height: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body data-phase="sealed">
  <div class="shell">
    <header class="topbar">
      <div class="mark"><span class="seal" aria-hidden="true">✧</span> 生日贺卡</div>
      <div class="top-actions">
        <p class="camera-badge" id="camera-badge" data-status="idle" hidden><span></span><span id="camera-label">手势未开启</span></p>
        <button class="sound-toggle" id="sound-toggle" type="button" aria-label="音效" aria-pressed="false"><span>音效关</span></button>
      </div>
    </header>

    <main class="card-layout">
      <section class="intro" aria-labelledby="title">
        <h1 id="title">为你点亮<br><em>一颗星。</em></h1>
        <p class="intro-copy" id="intro-copy">把手伸进镜头，让星尘聚成今天的蛋糕。</p>

        <ol class="steps" aria-label="贺卡进度">
          <li class="step" aria-current="step">聚星</li>
          <li class="step">点烛</li>
          <li class="step">烟花</li>
        </ol>

        <div class="gesture-cue" id="gesture-cue">
          <span id="gesture-icon" class="gesture-icon" aria-hidden="true">✋</span>
          <div><strong id="gesture-title">张开手掌</strong><p id="gesture-detail">保持一下，让星尘聚成蛋糕。</p></div>
        </div>
        <div class="controls">
          <button class="button primary" id="camera-button" type="button"><span class="camera-icon" aria-hidden="true"></span><span id="camera-action">开启手势</span></button>
        </div>
        <p class="status" id="status" role="status">开启后，把一只手放进镜头里。</p>
        <noscript><p class="status">请启用 JavaScript 体验互动。</p></noscript>
      </section>

      <section class="scene" id="scene" aria-label="生日星尘、粒子蛋糕和烟花">
        <canvas id="point-cloud" aria-hidden="true"></canvas>
        <canvas id="particle-scene" tabindex="0" role="img" aria-label="三维粒子画面，能拖动、用方向键或开启摄像头后用食指旋转"></canvas>
        <span class="scene-state" id="scene-state">星尘</span>
        <span class="orbit-hint" id="orbit-hint">拖动旋转</span>
        <div class="viewfinder" id="viewfinder" hidden>
          <video id="camera-video" autoplay muted playsinline aria-label="手势摄像头预览"></video>
          <span class="tracking-caption" id="tracking-label">等待手势</span>
          <div class="hold-track" aria-hidden="true"><div id="gesture-progress"></div></div>
        </div>
        <article class="letter" id="letter" aria-labelledby="letter-title" hidden>
          <h2 id="letter-title" tabindex="-1">生日快乐！</h2>
          <div id="greeting"></div>
          <p class="signature" id="signature" hidden></p>
        </article>
      </section>
    </main>

    <footer class="footnote"><span aria-hidden="true">✧</span> 摄像头画面只在当前设备处理。</footer>
  </div>
<script>
'use strict';

// 定制时可填写收件人、祝福和署名。留空时使用通用贺卡。
const BirthdayCard = {
  recipient: 'lh',
  greeting: [
    '新的一岁，愿你有喜欢的事可以期待，有想见的人可以相见。',
    '也愿你一直记得，自己的快乐值得被认真对待。生日快乐！',
  ],
  signature: '',
};

'use strict';

// Pinch detection adapted from Uynaity/birthday-gesture-site (MIT, as stated in its README).
// https://github.com/Uynaity/birthday-gesture-site/blob/main/script.js
const BirthdayGestures = (() => {
  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y, (a.z ?? 0) - (b.z ?? 0));
  }

  function isStraight(points, base, joint, tip) {
    const a = distance(points[base], points[joint]);
    const b = distance(points[joint], points[tip]);
    return a + b > 0 && distance(points[base], points[tip]) / (a + b) > .9;
  }

  function classify(points) {
    if (!points || points.length < 21) return null;

    const palm = distance(points[0], points[9]);
    if (!palm) return null;

    const index = isStraight(points, 5, 6, 8);
    const middle = isStraight(points, 9, 10, 12);
    const ring = isStraight(points, 13, 14, 16);
    const little = isStraight(points, 17, 18, 20);
    const fingersApart = distance(points[8], points[12]) > palm * .24;
    if (index && middle && !ring && !little && fingersApart) return 'victory';
    if (distance(points[4], points[8]) < palm * .29) return 'pinch';
    if (index && middle && ring && little) return 'palm';
    if (index && !middle && !ring && !little) return 'point';
    return null;
  }

  function createHold(duration) {
    let previous = null;
    let since = 0;
    let triggered = false;

    return {
      update(gesture, now) {
        if (gesture !== previous) {
          previous = gesture;
          since = now;
          triggered = false;
        }
        const progress = gesture ? Math.min(1, (now - since) / duration) : 0;
        const complete = progress === 1 && !triggered;
        if (complete) triggered = true;
        return { progress, complete };
      },
    };
  }

  return { classify, createHold };
})();

'use strict';

function createPointCloud(canvas) {
  const gl = canvas.getContext('webgl', { alpha: true, depth: false, antialias: false, powerPreference: 'low-power' });
  if (!gl) return null;

  const vertexSource = `
    attribute vec3 origin;
    attribute vec3 destination;
    attribute vec3 originColor;
    attribute vec3 cakeColor;
    attribute vec3 details;
    uniform vec2 viewport;
    uniform vec4 camera;
    uniform vec4 animation;
    uniform vec2 visibility;
    varying vec3 pigment;
    varying float opacity;
    varying float sparkle;

    void main() {
      float morph = animation.y;
      float radialSpread = animation.z;
      float time = animation.x;
      float stage = animation.w;
      float flame = details.z;
      float pulse = sin(time * 3.1 + details.y);

      vec3 point = mix(origin, destination, morph);
      float swirl = sin(morph * 3.14159) * (1.0 - details.x * 0.23) * 0.6;
      float spin = camera.z + swirl;
      float s = sin(spin);
      float c = cos(spin);
      float x = point.x * c - point.z * s;
      float z = point.x * s + point.z * c;
      float tiltSin = sin(camera.w);
      float tiltCos = cos(camera.w);
      float y = point.y * tiltCos + z * tiltSin;
      float depth = z * tiltCos - point.y * tiltSin;
      float perspective = 2.85 / max(0.8, 2.85 - depth * radialSpread);
      float flicker = sin(time * 7.6 + point.y * 12.0);
      x += flame * step(1.5, stage) * flicker * 0.018 * morph;
      y += sin(time * 1.8 + details.y) * mix(0.018, 0.008, morph);

      vec2 screen = vec2(viewport.x * 0.5, camera.y) +
        vec2(x, -y) * camera.x * perspective * radialSpread;
      gl_Position = vec4(screen.x / viewport.x * 2.0 - 1.0,
        1.0 - screen.y / viewport.y * 2.0, 0.0, 1.0);

      float front = smoothstep(-0.82, 0.85, depth);
      float nearGlow = step(1.1, details.x) * front;
      gl_PointSize = clamp((0.82 + details.x * 2.05 + nearGlow * 1.8) *
        perspective * visibility.y, 1.3, 10.0);
      pigment = mix(originColor, cakeColor, morph);
      pigment = mix(pigment, vec3(1.0, 0.97, 0.89), nearGlow * 0.45);
      opacity = (0.29 + front * 0.35 + pulse * 0.16 + nearGlow * 0.18) * visibility.x;
      sparkle = nearGlow;
      if (flame > 0.5 && stage > 0.5 && (stage < 1.5 || stage > 2.5)) opacity = 0.0;
      if (flame > 0.5 && stage > 1.5 && stage < 2.5) {
        opacity += 0.23 + flicker * 0.14;
        gl_PointSize *= 1.1;
      }
    }
  `;
  const fragmentSource = `
    precision mediump float;
    varying vec3 pigment;
    varying float opacity;
    varying float sparkle;

    void main() {
      vec2 uv = (gl_PointCoord - 0.5) * 2.0;
      float d = dot(uv, uv);
      float body = exp(-d * (6.8 - sparkle * 1.7)) * (1.0 - smoothstep(0.3, 1.0, d));
      float core = exp(-d * 20.0) * (0.25 + sparkle * 0.19);
      vec3 light = mix(pigment, vec3(1.0, 0.96, 0.91), core);
      gl_FragColor = vec4(light, clamp(opacity * (body + core), 0.0, 0.96));
    }
  `;

  function shader(kind, source) {
    const value = gl.createShader(kind);
    gl.shaderSource(value, source);
    gl.compileShader(value);
    if (gl.getShaderParameter(value, gl.COMPILE_STATUS)) return value;
    gl.deleteShader(value);
    return null;
  }

  const vertex = shader(gl.VERTEX_SHADER, vertexSource);
  const fragment = shader(gl.FRAGMENT_SHADER, fragmentSource);
  if (!vertex || !fragment) return null;
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return null;

  const buffer = gl.createBuffer();
  const uniform = Object.fromEntries(['viewport', 'camera', 'animation', 'visibility']
    .map((name) => [name, gl.getUniformLocation(program, name)]));
  const attributes = ['origin', 'destination', 'originColor', 'cakeColor', 'details'];
  let count = 0;
  let unavailable = false;
  canvas.addEventListener('webglcontextlost', () => { unavailable = true; });
  gl.useProgram(program);
  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  return {
    get available() { return !unavailable; },
    setPoints(points, palette) {
      const colors = palette.map((hex) => [1, 3, 5].map((offset) => parseInt(hex.slice(offset, offset + 2), 16) / 255));
      const data = new Float32Array(points.length * 15);
      let offset = 0;
      for (const point of points) {
        const from = point.origin;
        const to = point.target;
        data.set([
          from.x, from.y, from.z, to.x, to.y, to.z,
          ...colors[point.color], ...colors[to.color],
          point.size, point.twinkle, to.flame ? 1 : 0,
        ], offset);
        offset += 15;
      }
      count = points.length;
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      for (const [index, name] of attributes.entries()) {
        const position = gl.getAttribLocation(program, name);
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 3, gl.FLOAT, false, 60, index * 12);
      }
    },
    fit(width, height, dpr) {
      if (unavailable) return;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    },
    draw({ width, height, scale, centerY, angle, tilt, t, morph, stretch, stage, visible, dpr }) {
      gl.clear(gl.COLOR_BUFFER_BIT);
      if (visible <= 0) return;
      gl.uniform2f(uniform.viewport, width, height);
      gl.uniform4f(uniform.camera, scale, centerY, angle, tilt);
      gl.uniform4f(uniform.animation, t, morph, stretch, stage);
      gl.uniform2f(uniform.visibility, visible, dpr);
      gl.drawArrays(gl.POINTS, 0, count);
    },
  };
}

'use strict';

function createParticleScene(canvas, cloudCanvas) {
  const ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return { setPhase() {}, setHand() {} };

  const tau = Math.PI * 2;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const narrow = matchMedia('(max-width: 640px)');
  const cloud = createPointCloud(cloudCanvas);
  const fallbackCount = narrow.matches ? 2200 : 3200;
  const total = cloud ? (narrow.matches ? 9000 : 13500) : fallbackCount;
  canvas.dataset.renderer = cloud ? 'webgl' : 'canvas';
  canvas.dataset.particles = String(total);
  const sky = [];
  const points = [];
  const bursts = [
    { x: .50, y: .29, time: .63, hue: 38, size: .39 },
    { x: .24, y: .43, time: 1.05, hue: 337, size: .30 },
    { x: .77, y: .35, time: 1.40, hue: 205, size: .34 },
    { x: .60, y: .47, time: 1.85, hue: 312, size: .30 },
    { x: .35, y: .29, time: 2.16, hue: 45, size: .28 },
  ];
  const palette = ['#866797', '#e08bc2', '#ffd8e8', '#ffbd91', '#fff2cd', '#ff8fcb'];
  let width = 0;
  let height = 0;
  let phase = 'sealed';
  let phaseAt = performance.now();
  let cakeAt = phaseAt;
  let orbitYaw = null;
  let orbitPitch = 0;
  let displayedYaw = 0;
  let displayedPitch = 0;
  let drag = null;
  let airAnchor = null;
  let frame = 0;
  let dpr = 1;
  let lastFrame = 0;
  let seed = 19204;

  function rand() {
    seed = (1664525 * seed + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const jitter = (amount) => (rand() - rand()) * amount;

  function galaxy(index) {
    const radius = .08 + Math.pow(rand(), .73) * 1.01;
    const angle = index % 3 * tau / 3 + radius * 4.25 + jitter(.67);
    return {
      x: Math.cos(angle) * radius,
      y: jitter(.24) + Math.sin(angle * 2) * .07,
      z: Math.sin(angle) * radius,
    };
  }

  function cake(index) {
    const unit = index / total;
    const a = rand() * tau;
    let r, y, color;
    if (unit < .13) {
      r = .73 + jitter(.095);
      y = -.57 + jitter(.033);
      color = rand() < .55 ? 3 : 2;
    } else if (unit < .86) {
      const tier = unit < .45 ? 0 : unit < .69 ? 1 : 2;
      const base = [-.53, -.18, .14][tier];
      const top = [-.19, .13, .41][tier];
      const radius = [.64, .49, .335][tier];
      const band = rand();
      if (band < .54) {
        r = radius + jitter(.029);
        y = (rand() < .73 ? top : base) + jitter(.021);
        color = rand() < .64 ? 4 : 2;
      } else if (band < .84) {
        r = radius + jitter(.055);
        y = base + (top - base) * rand();
        color = Math.sin(a * 10 + y * 21) > .25 ? 5 : 1;
      } else {
        r = radius * Math.sqrt(rand());
        y = top - rand() * .026;
        color = rand() < .78 ? 2 : 3;
      }
    } else if (unit < .94) {
      r = .033 + jitter(.012);
      y = .415 + rand() * .29;
      color = Math.sin(y * 104 + a) > -.18 ? 4 : 5;
    } else {
      const t = rand();
      r = Math.sin(t * Math.PI) * .081 * Math.sqrt(rand());
      y = .71 + t * .305;
      color = t < .52 ? 4 : 3;
      return { x: Math.cos(a) * r + t * .048, y, z: Math.sin(a) * r, color, flame: true };
    }
    return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, color, flame: false };
  }

  for (let i = 0; i < total; i += 1) {
    const origin = galaxy(i);
    const target = cake(i);
    points.push({
      origin, target, x: origin.x, y: origin.y, z: origin.z, color: i % 6,
      size: .49 + Math.pow(rand(), 3) * 1.14, twinkle: rand() * tau,
    });
  }
  cloud?.setPoints(points, palette);
  for (let i = 0; i < 130; i += 1) {
    sky.push({ x: rand(), y: rand(), size: .35 + Math.pow(rand(), 4) * 1.5, wave: rand() * tau });
  }
  for (const burst of bursts) {
    burst.sparks = Array.from({ length: narrow.matches ? 78 : 115 }, (_, index) => {
      const angle = tau * index / (narrow.matches ? 78 : 115) + jitter(.35);
      const speed = .32 + Math.pow(rand(), .56) * .95;
      return {
        x: Math.cos(angle) * speed, y: Math.sin(angle) * speed,
        size: .55 + rand() * 1.22, fade: .64 + rand() * .9, phase: rand() * tau,
      };
    });
  }

  function renderSky(t) {
    ctx.fillStyle = '#fbe4ff';
    for (const star of sky) {
      ctx.globalAlpha = .12 + (.12 + .18 * Math.sin(t * .65 + star.wave)) * star.size;
      ctx.fillRect(star.x * width, star.y * height, star.size, star.size);
    }
    ctx.globalAlpha = 1;
  }

  function firework(burst, elapsed, scale) {
    const time = elapsed - burst.time;
    const x = burst.x * width;
    const y = burst.y * height;
    if (time >= -.51 && time < 0 && !reduced.matches) {
      const rise = (time + .51) / .51;
      const tail = (height - y) * (1 - rise) ** 2 + y;
      const trail = ctx.createLinearGradient(x, tail, x, tail + 42);
      trail.addColorStop(0, 'rgba(255, 228, 177, .9)');
      trail.addColorStop(1, 'rgba(255, 160, 119, 0)');
      ctx.fillStyle = trail;
      ctx.fillRect(x - 1, tail, 2.1, 42);
      return;
    }
    if (time < 0 || time > 2.2) return;

    const travel = (1 - Math.exp(-2.8 * time)) * scale * burst.size * 2;
    const tailTravel = (1 - Math.exp(-2.8 * Math.max(0, time - .20))) * scale * burst.size * 2;
    const fall = time * time * 29;
    if (time < .36) {
      const light = ctx.createRadialGradient(x, y, 0, x, y, 46);
      light.addColorStop(0, `hsla(${burst.hue}, 100%, 86%, ${.72 * (1 - time / .36)})`);
      light.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = light;
      ctx.fillRect(x - 46, y - 46, 92, 92);
    }
    ctx.strokeStyle = `hsl(${burst.hue} 100% 77%)`;
    ctx.fillStyle = `hsl(${burst.hue} 100% 91%)`;
    for (const spark of burst.sparks) {
      const fade = Math.exp(-time * spark.fade) * (1 - time / 2.2);
      const px = x + spark.x * travel;
      const py = y + spark.y * travel + fall;
      ctx.globalAlpha = Math.max(0, fade * (.77 + .23 * Math.sin(time * 25 + spark.phase)));
      ctx.lineWidth = spark.size * .85;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(x + spark.x * tailTravel, y + spark.y * tailTravel + fall - time * 6);
      ctx.stroke();
      ctx.fillRect(px, py, spark.size, spark.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawRims(scale, centerY, tilt, amount) {
    const rims = [[.73, -.57], [.64, -.19], [.49, .13], [.335, .41]];
    ctx.strokeStyle = '#ffcda8';
    for (const [radius, y] of rims) {
      ctx.beginPath();
      for (let segment = 0; segment <= 72; segment += 1) {
        const angle = segment / 72 * tau;
        const z = Math.sin(angle) * radius;
        const perspective = 2.85 / (2.85 - z * Math.cos(tilt) + y * Math.sin(tilt));
        const x = width * .5 + Math.cos(angle) * radius * scale * perspective;
        const py = centerY - (y * Math.cos(tilt) + z * Math.sin(tilt)) * scale * perspective;
        if (segment === 0) ctx.moveTo(x, py);
        else ctx.lineTo(x, py);
      }
      ctx.globalAlpha = amount * .055;
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.globalAlpha = amount * .26;
      ctx.lineWidth = .8;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function paint(now, still = false) {
    if (!width || !height) return;
    const elapsed = still ? 1.23 : Math.max(0, (now - phaseAt) / 1000);
    const t = still ? .85 : now / 1000;
    const sealed = phase === 'sealed';
    const lit = phase === 'lit';
    const finale = phase === 'celebrated';
    ctx.clearRect(0, 0, width, height);
    renderSky(t);
    const scale = Math.min(width * .48, height * .49);
    const centerY = height * (sealed ? .51 : .53);
    const yaw = orbitYaw ?? t * .165;
    displayedYaw = orbitYaw === null || still ? yaw : displayedYaw + (yaw - displayedYaw) * .28;
    displayedPitch = still ? orbitPitch : displayedPitch + (orbitPitch - displayedPitch) * .28;
    const angle = displayedYaw;
    const sin = Math.sin(angle);
    const cos = Math.cos(angle);
    const morph = sealed ? 0 : still ? 1 : 1 - Math.exp(-Math.max(0, now - cakeAt) / 320);
    const tilt = Math.max(-.62, Math.min(1.1, .50 - morph * .26 + displayedPitch));
    const st = Math.sin(tilt);
    const ct = Math.cos(tilt);
    const stretch = finale ? 1 + (1 - Math.exp(-elapsed * 3.5)) * 1.8 : 1;
    const visible = finale ? Math.max(0, 1 - elapsed / 1.3) : 1;
    const blend = still ? 1 : .067;

    ctx.globalCompositeOperation = 'lighter';
    if (cloud?.available) {
      cloud.draw({
        width, height, scale, centerY, tilt, angle, t, morph, stretch, visible, dpr,
        stage: sealed ? 0 : lit ? 2 : finale ? 3 : 1,
      });
    } else if (visible) {
      const stride = Math.max(1, Math.ceil(points.length / fallbackCount));
      for (let index = 0; index < points.length; index += stride) {
        const p = points[index];
        const target = sealed ? p.origin : p.target;
        p.x += (target.x - p.x) * blend;
        p.y += (target.y - p.y) * blend;
        p.z += (target.z - p.z) * blend;

        if (!sealed && p.target.flame && !lit) continue;

        const sway = Math.sin(t * 1.5 + p.twinkle) * (sealed ? .017 : .007);
        const px = (p.x * cos - p.z * sin) * stretch;
        const z = (p.x * sin + p.z * cos) * stretch;
        const py = (p.y * ct + z * st + sway) * stretch;
        const depth = z * ct - p.y * st;
        const perspective = 2.85 / (2.85 - depth);
        const sx = width * .5 + px * scale * perspective;
        const sy = centerY - py * scale * perspective;
        const size = p.size * perspective;
        const color = sealed ? p.color : p.target.color;

        ctx.fillStyle = palette[color];
        ctx.globalAlpha = visible * (.42 + .28 * perspective + .14 * Math.sin(t * 3 + p.twinkle));
        ctx.fillRect(sx - size * .5, sy - size * .5, size, size);
        if (size > 1.5) {
          ctx.globalAlpha *= .15;
          ctx.fillRect(sx - size * 1.15, sy - size * 1.15, size * 2.3, size * 2.3);
        }
      }
    }
    if (!sealed && !finale && morph > .14) drawRims(scale, centerY, tilt, morph);

    if (lit) {
      ctx.globalAlpha = Math.max(0, .7 + Math.sin(t * 7.2) * .19);
      const glowX = width * .5;
      const glowY = centerY - scale * .84;
      const glow = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, scale * .39);
      glow.addColorStop(0, 'rgba(255, 198, 100, .42)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
    }
    ctx.globalAlpha = 1;
    if (finale) {
      for (const burst of bursts) firework(burst, still ? burst.time + .63 : elapsed, scale);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  function animate(now) {
    if (phase === 'celebrated' && now - phaseAt > 4500) {
      paint(now);
      frame = 0;
      return;
    }
    if (now - lastFrame >= (narrow.matches ? 24 : 13)) {
      paint(now);
      lastFrame = now;
    }
    frame = requestAnimationFrame(animate);
  }

  function refresh() {
    cancelAnimationFrame(frame);
    if (reduced.matches) paint(performance.now(), true);
    else frame = requestAnimationFrame(animate);
  }

  function fit() {
    const bounds = canvas.getBoundingClientRect();
    width = bounds.width;
    height = bounds.height;
    dpr = Math.min(devicePixelRatio || 1, 1.65);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cloud?.fit(width, height, dpr);
    if (reduced.matches) paint(performance.now(), true);
    else if (!frame) paint(performance.now());
  }

  function rotateBy(dx, dy) {
    const now = performance.now();
    const autoYaw = (reduced.matches ? .85 : now / 1000) * .165;
    orbitYaw = (orbitYaw ?? autoYaw) + dx * .009;
    orbitPitch = Math.max(-.85, Math.min(.75, orbitPitch + dy * .007));
    if (reduced.matches) paint(now, true);
  }

  function trackFinger(tip) {
    if (!tip || drag || phase === 'celebrated') {
      airAnchor = null;
      return;
    }
    const now = performance.now();
    const dx = airAnchor ? airAnchor.x - tip.x : 0;
    const dy = airAnchor ? tip.y - airAnchor.y : 0;
    if (!airAnchor || now - airAnchor.seen > 250 || Math.max(Math.abs(dx), Math.abs(dy)) > .25) {
      airAnchor = { x: tip.x, y: tip.y, seen: now };
      return;
    }
    airAnchor.seen = now;
    if (Math.hypot(dx, dy) < .005) return;
    const distance = Math.min(width, height) * 1.7;
    rotateBy(dx * distance, dy * distance);
    airAnchor.x = tip.x;
    airAnchor.y = tip.y;
  }

  function endDrag(id) {
    if (drag?.id !== id) return;
    drag = null;
    canvas.removeAttribute('data-dragging');
    if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
  }

  canvas.addEventListener('pointerdown', (event) => {
    if (phase === 'celebrated' || drag || !event.isPrimary || event.button !== 0) return;
    airAnchor = null;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
    canvas.setPointerCapture(event.pointerId);
    canvas.setAttribute('data-dragging', '');
  });
  canvas.addEventListener('pointermove', (event) => {
    if (drag?.id !== event.pointerId) return;
    rotateBy(event.clientX - drag.x, event.clientY - drag.y);
    drag.x = event.clientX;
    drag.y = event.clientY;
  });
  for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    canvas.addEventListener(eventName, (event) => endDrag(event.pointerId));
  }
  const arrowStep = { ArrowLeft: [-25, 0], ArrowRight: [25, 0], ArrowUp: [0, -25], ArrowDown: [0, 25] };
  canvas.addEventListener('keydown', (event) => {
    const delta = arrowStep[event.key];
    if (phase === 'celebrated' || !delta) return;
    event.preventDefault();
    rotateBy(...delta);
  });

  new ResizeObserver(fit).observe(canvas);
  reduced.addEventListener('change', refresh);
  fit();
  refresh();
  return {
    setPhase(next) {
      phase = next;
      phaseAt = performance.now();
      airAnchor = null;
      if (next === 'ready') cakeAt = phaseAt;
      if (next === 'celebrated') {
        if (drag) endDrag(drag.id);
        canvas.tabIndex = -1;
      }
      if (reduced.matches) paint(phaseAt, true);
    },
    setHand(points) {
      trackFinger(points?.[8]);
    },
  };
}

'use strict';

function createCardSound(button) {
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  const cues = {
    ready: [[587, 0, .27], [880, .11, .27]],
    lit: [[784, 0, .30], [1175, .055, .23]],
    celebrated: [[523, 0, .36], [784, .10, .36], [1047, .21, .42]],
  };
  let context;
  let output;
  let enabled = false;

  function setEnabled(next) {
    enabled = next;
    button.setAttribute('aria-pressed', String(enabled));
    button.firstElementChild.textContent = enabled ? '音效开' : '音效关';
    if (output) output.gain.setValueAtTime(enabled ? .09 : 0, context.currentTime);
  }

  button.hidden = !AudioEngine;
  button.addEventListener('click', async () => {
    if (enabled) {
      setEnabled(false);
      return;
    }
    button.disabled = true;
    try {
      if (!context || context.state === 'closed') {
        context = new AudioEngine();
        output = context.createGain();
        output.gain.value = 0;
        output.connect(context.destination);
      }
      await context.resume();
      setEnabled(context.state === 'running' && !document.hidden);
    } catch {
      setEnabled(false);
    } finally {
      button.disabled = false;
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && enabled) setEnabled(false);
  });

  return {
    play(phase) {
      if (!enabled || context?.state !== 'running') return;
      const now = context.currentTime + .02;
      for (const [frequency, delay, duration] of cues[phase] || []) {
        const note = context.createOscillator();
        const gain = context.createGain();
        const start = now + delay;
        const end = start + duration;
        note.type = 'sine';
        note.frequency.value = frequency;
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(.32, start + .025);
        gain.gain.exponentialRampToValueAtTime(.0001, end);
        note.connect(gain);
        gain.connect(output);
        note.addEventListener('ended', () => {
          note.disconnect();
          gain.disconnect();
        }, { once: true });
        note.start(start);
        note.stop(end);
      }
    },
  };
}

'use strict';

const byId = (id) => document.getElementById(id);
const video = byId('camera-video');
const scene = byId('scene');
const status = byId('status');
const cameraButton = byId('camera-button');
const letter = byId('letter');
const trackingLabel = byId('tracking-label');
const steps = document.querySelectorAll('.step');
const particles = createParticleScene(byId('particle-scene'), byId('point-cloud'));
const sound = createCardSound(byId('sound-toggle'));
const hold = BirthdayGestures.createHold(390);
const handsBase = 'https://unpkg.com/@mediapipe/hands@0.4.1675469240/';
const phases = {
  sealed: {
    gesture: 'palm', step: 0, next: 'ready', icon: '✋',
    title: '张开手掌', detail: '保持一下，让星尘聚成蛋糕。',
    copy: '把手伸进镜头，让星尘聚成今天的蛋糕。', scene: '星尘',
  },
  ready: {
    gesture: 'pinch', step: 1, next: 'lit', icon: '🤏',
    title: '捏合手指', detail: '让拇指和食指轻轻碰在一起。',
    copy: '蛋糕已经成形，还差一点烛光。', scene: '等你点亮蜡烛',
  },
  lit: {
    gesture: 'victory', step: 2, next: 'celebrated', icon: '✌️',
    title: '许完愿，做个剪刀手', detail: '伸出食指和中指，保持一下。',
    copy: '愿望可以慢慢想。准备好后，放一场烟花。', scene: '许个愿',
  },
  celebrated: { copy: '今晚的烟花，送给今天的你。', scene: '愿望已送出' },
};
let phase = 'sealed';
let camera = null;
let handsLibrary = null;

for (const line of BirthdayCard.greeting) {
  const paragraph = document.createElement('p');
  paragraph.textContent = line;
  byId('greeting').append(paragraph);
}
if (BirthdayCard.signature) {
  byId('signature').textContent = '—— ' + BirthdayCard.signature;
  byId('signature').hidden = false;
}

function showCamera(state) {
  const badge = byId('camera-badge');
  badge.dataset.status = state;
  badge.hidden = state === 'idle';
  document.body.toggleAttribute('data-camera-active', state === 'active');
  byId('camera-label').textContent = {
    idle: '手势未开启', loading: '正在开启手势', active: '手势已开启',
  }[state];
  byId('camera-action').textContent = {
    idle: '开启手势', loading: '取消开启', active: '关闭摄像头',
  }[state];
  byId('orbit-hint').textContent = state === 'active' ? '☝️ 食指隔空旋转' : '拖动旋转';
  byId('viewfinder').hidden = !camera?.stream;
}

function showTracking(text, progress = 0) {
  if (trackingLabel.textContent !== text) trackingLabel.textContent = text;
  byId('gesture-progress').style.transform = 'scaleX(' + progress + ')';
}

function setPhase(next) {
  phase = next;
  document.body.dataset.phase = phase;
  particles.setPhase(phase);
  sound.play(phase);
  hold.update(null, performance.now());

  const current = phases[phase];
  const complete = phase === 'celebrated';
  for (const [index, step] of steps.entries()) {
    if (index === current.step) step.setAttribute('aria-current', 'step');
    else step.removeAttribute('aria-current');
  }
  byId('intro-copy').textContent = current.copy;
  byId('gesture-cue').hidden = complete;
  byId('scene-state').textContent = current.scene;
  cameraButton.parentElement.hidden = complete;
  const heading = byId('letter-title');
  if (complete && BirthdayCard.recipient) heading.textContent = BirthdayCard.recipient + '，生日快乐！';
  letter.hidden = !complete;

  if (complete) {
    stopCamera();
    status.textContent = '生日祝福已送到。';
    heading.focus({ preventScroll: true });
    const bounds = scene.getBoundingClientRect();
    if (bounds.top < 0 || bounds.bottom > window.innerHeight) {
      scene.scrollIntoView({ block: 'nearest' });
    }
    return;
  }

  byId('gesture-icon').textContent = current.icon;
  byId('gesture-title').textContent = current.title;
  byId('gesture-detail').textContent = current.detail;
  status.textContent = '把手势保持片刻即可。';
  showTracking('等待手势');
}

function handleHand(results, session) {
  if (camera !== session || !session.active) return;
  const points = results.multiHandLandmarks?.[0];
  const gesture = BirthdayGestures.classify(points);
  particles.setHand(gesture === 'point' ? points : null);
  const current = phases[phase];
  const { progress, complete } = hold.update(gesture === current.gesture ? gesture : null, performance.now());
  if (gesture === 'point') showTracking('移动食指旋转');
  else showTracking(!points ? '把手放进画面' : progress > 0 ? '保持这个手势' : '看一眼手势提示', progress);
  if (complete) setPhase(current.next);
}

function loadHands() {
  if (typeof window.Hands === 'function') return Promise.resolve(window.Hands);
  if (handsLibrary) return handsLibrary;

  handsLibrary = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = handsBase + 'hands.js';
    script.crossOrigin = 'anonymous';

    function fail() {
      clearTimeout(timer);
      script.remove();
      reject(new Error('Hand tracking library unavailable'));
    }

    const timer = setTimeout(fail, 15000);
    script.onerror = fail;
    script.onload = () => {
      clearTimeout(timer);
      if (typeof window.Hands === 'function') resolve(window.Hands);
      else fail();
    };
    document.head.append(script);
  }).catch((error) => {
    handsLibrary = null;
    throw error;
  });

  return handsLibrary;
}

function stopCamera(message) {
  const session = camera;
  camera = null;
  if (session) {
    cancelAnimationFrame(session.frame);
    clearTimeout(session.timer);
    session.stream?.getTracks().forEach((track) => track.stop());
    video.pause();
    video.srcObject = null;
    if (session.hands) {
      Promise.resolve(session.processing).catch(() => {}).then(() => session.hands.close()).catch(() => {});
    }
  }
  hold.update(null, performance.now());
  particles.setHand(null);
  showCamera('idle');
  showTracking('等待手势');
  if (message) status.textContent = message;
}

function trackFrames(session) {
  let lastSent = 0;
  let lastVideoTime = -1;

  async function frame(now) {
    if (camera !== session) return;
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime && now - lastSent >= 46) {
      lastSent = now;
      lastVideoTime = video.currentTime;
      try {
        session.processing = session.hands.send({ image: video });
        await session.processing;
      } catch {
        if (camera === session) stopCamera('手势识别已中断，请重新开启。');
        return;
      } finally {
        session.processing = null;
      }
    }
    if (camera === session) session.frame = requestAnimationFrame(frame);
  }

  session.frame = requestAnimationFrame(frame);
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    status.textContent = '当前浏览器无法使用摄像头。请用手机或电脑的系统浏览器打开。';
    return;
  }

  const session = {};
  camera = session;
  showCamera('loading');
  status.textContent = '请在浏览器弹窗中允许使用摄像头。';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 } },
    });
    if (camera !== session) {
      stream.getTracks().forEach((track) => track.stop());
      return;
    }
    session.stream = stream;
    stream.getVideoTracks()[0]?.addEventListener('ended', () => {
      if (camera === session) stopCamera('摄像头已断开，请重新开启。');
    });
    showCamera('loading');
    showTracking('正在准备');
    status.textContent = '首次开启需要一点时间。';
    session.timer = setTimeout(() => {
      if (camera === session) stopCamera('手势加载超时，请检查网络后重试。');
    }, 25000);

    video.srcObject = stream;
    const [Hands] = await Promise.all([loadHands(), video.play()]);
    if (camera !== session) return;
    const hands = new Hands({ locateFile: (file) => handsBase + file });
    session.hands = hands;
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: .55, minTrackingConfidence: .55 });
    hands.onResults((results) => handleHand(results, session));

    session.processing = hands.initialize();
    await session.processing;
    if (camera !== session) return;
    session.processing = null;
    session.active = true;
    clearTimeout(session.timer);
    showCamera('active');
    status.textContent = '把手势保持片刻即可。';
    trackFrames(session);
  } catch (error) {
    if (camera !== session) return;
    const messages = {
      NotAllowedError: '请在浏览器的站点权限里允许使用摄像头，再重新开启。',
      NotFoundError: '没有找到摄像头，请换一台有摄像头的设备打开。',
      NotReadableError: '摄像头可能正被占用，关闭其他用到摄像头的页面后重试。',
    };
    stopCamera(messages[error.name] || '手势暂时无法开启，请检查网络后重试。');
  }
}

cameraButton.addEventListener('click', () => {
  if (camera) stopCamera('手势已关闭。重新开启后可以接着刚才的步骤。');
  else void startCamera();
});
window.addEventListener('pagehide', () => stopCamera());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && camera) stopCamera('手势已暂停，返回后可重新开启。');
});
</script>
