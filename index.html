<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="捏合手指点亮蜡烛，许个愿，收下一封生日祝福。">
  <meta name="theme-color" content="#fff8f5">
  <title>给你一场生日惊喜</title>
  <style>
:root {
  color-scheme: light;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --ink: #351d29;
  --muted: #735764;
  --berry: #972d50;
  --edge: #edd8de;
  --paper: #fff8f5;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", SimSun, Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 260px;
  min-height: 100vh;
  background: radial-gradient(ellipse at 77% 14%, #ffebe8 0, transparent 48%), var(--paper);
  color: var(--ink);
}
button { font: inherit; }
[hidden] { display: none !important; }
button:focus-visible, h2:focus-visible { outline: 3px solid #9f4160; outline-offset: 5px; }
.shell { width: min(1160px, calc(100% - 96px)); margin: 0 auto; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 22px 0 19px;
  border-bottom: 1px solid var(--edge);
}
.mark { display: flex; align-items: center; gap: 10px; font-size: .875rem; font-weight: 650; letter-spacing: .1em; }
.seal { color: var(--berry); background: #fae2e8; border: 1px solid #f0c9d5; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-size: 1.12rem; }
.camera-badge { font-size: .875rem; color: var(--muted); display: flex; align-items: center; gap: 7px; margin: 0; }
.camera-badge > span:first-child { width: 7px; height: 7px; border-radius: 50%; background: #a68a95; }
.camera-badge[data-status="active"] > span:first-child { background: #397454; box-shadow: 0 0 0 3px #39745424; }
.camera-badge[data-status="loading"] > span:first-child { background: #b55d15; }
.card-layout { display: grid; grid-template-columns: .82fr 1.18fr; align-items: center; gap: clamp(1.5rem, 5vw, 5rem); padding: clamp(36px, 8vh, 90px) 0 40px; }
.intro h1 { margin: 0; font: 700 clamp(3.15rem, 6vw, 6.15rem)/1.09 var(--serif); letter-spacing: -.085em; }
.intro h1 em { color: var(--berry); font-style: normal; }
.intro h1 em span { color: #ba7381; }
.intro-copy { color: var(--muted); font-size: clamp(1rem, 1.4vw, 1.13rem); line-height: 1.85; margin: 22px 0 24px; }
.recipient { color: var(--berry); margin: 16px 0 -12px; overflow-wrap: anywhere; }
.steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; list-style: none; padding: 0; margin: 0 0 23px; max-width: 390px; }
.step { display: flex; gap: 8px; align-items: center; padding: 9px; border: 1px solid var(--edge); border-radius: 12px; color: var(--muted); background: #ffffff52; }
.step[aria-current] { background: #ffedf0; border-color: #e6acbd; color: #572339; }
.step strong, .step small { display: block; font-size: .875rem; line-height: 1.45; }
.step small { font-size: .79rem; margin-top: 2px; }
.gesture-icon { display: grid; place-items: center; flex: none; background: #fff8f5; border-radius: 8px; width: 34px; height: 36px; font-size: 1.25rem; }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.button { border: 1px solid transparent; border-radius: 999px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 18px; cursor: pointer; font-size: .9rem; font-weight: 650; transition: background .16s, transform .16s; }
.button:active { transform: scale(.98); }
.primary { background: var(--berry); color: #fff; box-shadow: 0 5px 13px #972d5026; }
.primary:hover { background: #79223f; }
.secondary { background: #fffaf8; color: #63263e; border-color: #e9ced8; }
.secondary:hover { background: #ffedf1; }
.camera-icon { display: inline-block; width: 13px; height: 10px; margin-right: 4px; border: 1.5px solid currentColor; position: relative; border-radius: 2px; }
.camera-icon::after { content: ""; position: absolute; right: -5px; top: 1px; width: 4px; height: 5px; background: currentColor; clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 70%); }
.status { color: var(--muted); font-size: .875rem; min-height: 2.5em; line-height: 1.52; margin: 13px 0 0; }
.scene { min-width: 0; position: relative; isolation: isolate; border-radius: 25px; padding: 8px; border: 1px solid #efcfd6; background: #fffdfa; box-shadow: 0 16px 60px #88455719, 0 2px 6px #945a6110; }
.art { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 17px; background: #f6d5cb; }
.art img { display: block; width: 100%; height: 100%; object-fit: fill; }
.art canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
.scene-state { position: absolute; z-index: 5; left: 19px; top: 19px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 7px 11px; font-size: .82rem; font-weight: 650; color: #623146; background: #fff8f4f5; box-shadow: 0 2px 12px #80364a13; }
.candle { position: absolute; z-index: 2; width: 1.25%; min-width: 4px; height: 13%; left: 50%; bottom: 46%; transform: translateX(-50%); border-radius: 35% 35% 16% 16% / 7% 7% 4% 4%; background: repeating-linear-gradient(155deg, #fff4e3 0 5px, #cb5573 6px 8px, #ece1ce 9px 10px); box-shadow: inset -2px 0 2px #5f234d35, 1px 1px 2px #57304188; }
.wick { background: #633a37; width: 28%; height: 9%; min-width: 1px; position: absolute; left: 36%; bottom: 99%; border-radius: 2px 2px 0 0; }
.flame { display: none; position: absolute; width: 175%; min-width: 9px; aspect-ratio: .55; left: 50%; bottom: 106%; border-radius: 80% 20% 66% 42%; transform: translateX(-50%) rotate(-9deg); transform-origin: 50% 100%; background: radial-gradient(ellipse at 48% 75%, #fffdf0 3%, #fff2a5 33%, #ffba50 66%, #f98550 95%); box-shadow: 0 0 9px #ffbb69, 0 0 25px #ffbd5d; }
[data-phase="lit"] .flame { display: block; animation: flicker .8s infinite alternate ease-in-out; }
@keyframes flicker { to { transform: translateX(-50%) rotate(7deg) scale(.88, 1.08); } }
.viewfinder { overflow: hidden; position: absolute; z-index: 6; right: 19px; bottom: 19px; width: clamp(96px, 26%, 146px); border-radius: 12px; background: #442633; border: 2px solid #fff5ec; box-shadow: 0 5px 18px #32101e35; }
.viewfinder video { display: block; width: 100%; aspect-ratio: 4 / 3; background: #402431; object-fit: cover; transform: scaleX(-1); }
.tracking-caption { display: block; color: #fff5f8; text-align: center; font-size: .75rem; padding: 5px 2px 4px; }
.hold-track { height: 3px; background: #75505d; }
#gesture-progress { height: 100%; background: #ffadc0; transform: scaleX(0); transform-origin: left center; transition: transform .08s linear; }
.letter {
  color: #482438; position: absolute; z-index: 5; inset: 13% 11%; display: flex; flex-direction: column; justify-content: safe center; align-items: center; text-align: center; overflow: auto;
  border: 1px solid #e9bcc7; outline: 1px solid #f2d4db; outline-offset: -6px; border-radius: 16px; background: #fff9f3f7; box-shadow: 0 12px 35px #4a192943; padding: 17px clamp(12px, 4vw, 37px);
  animation: unfold .6s both ease-out;
}
.letter-seal { display: grid; place-items: center; color: var(--berry); background: #f7d9e2; border-radius: 50%; width: 32px; height: 32px; flex: none; }
.letter h2 { font: 700 clamp(1.6rem, 3.5vw, 3rem)/1.15 var(--serif); color: var(--berry); margin: 9px 0 6px; }
.letter p { font-size: clamp(.875rem, 1.45vw, 1rem); line-height: 1.65; margin: 5px 0; overflow-wrap: anywhere; }
.letter .signature { align-self: end; color: var(--berry); }
[data-phase="celebrated"] .scene-state { display: none; }
@keyframes unfold { from { opacity: 0; transform: translateY(15px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
.footnote { display: flex; align-items: center; gap: 7px; border-top: 1px solid var(--edge); padding: 15px 0 20px; color: var(--muted); font-size: .82rem; }
.footnote span { color: var(--berry); }

@media (max-width: 850px) {
  .shell { width: min(650px, calc(100% - 36px)); }
  .topbar { padding: 14px 0; }
  .card-layout { grid-template-columns: minmax(0, 1fr); padding: 22px 0 20px; gap: 16px; }
  .intro { display: contents; }
  .intro h1 { font-size: clamp(2.6rem, 8vw, 4.5rem); letter-spacing: -.07em; }
  .intro h1 br { display: none; }
  .intro-copy { margin: -10px 0 0; line-height: 1.55; }
  .intro-copy br { display: none; }
  .recipient { margin: -6px 0 0; }
  .scene { grid-row: auto; order: 1; padding: 6px; border-radius: 20px; }
  .art { border-radius: 13px; }
  .steps { order: 2; margin: 0; max-width: none; }
  .controls { order: 3; }
  .status { order: 4; margin: -7px 0 0; min-height: 1.5em; }
  .scene-state { top: 13px; left: 13px; }
  .viewfinder { bottom: 13px; right: 13px; }
}
@media (max-width: 390px) {
  .shell { width: calc(100% - 28px); }
  .intro h1 { font-size: clamp(1.85rem, 8.1vw, 3.1rem); }
  .mark { letter-spacing: .02em; }
  .seal { width: 30px; height: 30px; }
  .letter { inset: 8%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  [data-phase="lit"] .flame { animation-iteration-count: 1; }
}
</style>
</head>
<body data-phase="ready">
  <div class="shell">
    <header class="topbar">
      <div class="mark"><span class="seal" aria-hidden="true">✦</span> 给你的一张贺卡</div>
      <p class="camera-badge" id="camera-badge" data-status="idle"><span></span><span id="camera-label">手势未开启</span></p>
    </header>

    <main class="card-layout">
      <section class="intro" aria-labelledby="title">
        <h1 id="title">给你一场<br><em>生日惊喜<span>。</span></em></h1>
        <p class="recipient" id="recipient" hidden></p>
        <p class="intro-copy">点一根蜡烛，许一个小小的愿。<br>今天的这份祝福，留给你慢慢拆。</p>

        <ol class="steps" aria-label="互动步骤">
          <li class="step" id="light-step" aria-current="step"><span class="gesture-icon" aria-hidden="true">🤏</span><span><strong>捏合手指</strong><small>点亮蜡烛</small></span></li>
          <li class="step" id="wish-step"><span class="gesture-icon" aria-hidden="true">✌️</span><span><strong>比个剪刀手</strong><small>许愿后，拆开祝福</small></span></li>
        </ol>

        <div class="controls" id="controls">
          <button class="button primary" id="camera-button" type="button"><span class="camera-icon" aria-hidden="true"></span><span id="camera-action">开启手势</span></button>
          <button class="button secondary" id="tap-button" type="button">点击点亮</button>
          <button class="button secondary" id="reset-button" type="button" hidden>再许一次愿</button>
        </div>
        <p class="status" id="status" role="status">也可以点击完成整张贺卡。</p>
        <noscript><p class="status">请启用 JavaScript 体验互动。</p></noscript>
      </section>

<script>
'use strict';

// 定制时可填写收件人、祝福和署名。留空时使用通用贺卡。
const BirthdayCard = {
  recipient: '',
  greeting: [
    '新的一岁，愿你有喜欢的事可以期待，有想见的人可以相见。',
    '也愿你一直记得，自己的快乐值得被认真对待。生日快乐！',
  ],
  signature: '',
};

'use strict';

// Pinch detection adapted from Uynaity/birthday-gesture-site (MIT, as stated in its README).
// https://github.com/Uynaity/birthday-gesture-site/blob/main/script.js
const BirthdayGestures = (() => {
  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y, (a.z ?? 0) - (b.z ?? 0));
  }

  function isStraight(points, base, joint, tip) {
    const a = distance(points[base], points[joint]);
    const b = distance(points[joint], points[tip]);
    return a + b > 0 && distance(points[base], points[tip]) / (a + b) > .9;
  }

  function classify(points) {
    if (!points || points.length < 21) return null;

    const palm = distance(points[0], points[9]);
    if (!palm) return null;

    const fingersApart = distance(points[8], points[12]) > palm * .24;
    const victory = fingersApart &&
      isStraight(points, 5, 6, 8) && isStraight(points, 9, 10, 12) &&
      !isStraight(points, 13, 14, 16) && !isStraight(points, 17, 18, 20);
    if (victory) return 'victory';

    return distance(points[4], points[8]) < palm * .29 ? 'pinch' : null;
  }

  function createHold(duration) {
    let previous = null;
    let since = 0;
    let triggered = false;

    return {
      update(gesture, now) {
        if (gesture !== previous) {
          previous = gesture;
          since = now;
          triggered = false;
        }
        const progress = gesture ? Math.min(1, (now - since) / duration) : 0;
        const complete = progress === 1 && !triggered;
        if (complete) triggered = true;
        return { progress, complete };
      },
    };
  }

  return { classify, createHold };
})();

'use strict';

const byId = (id) => document.getElementById(id);
const video = byId('camera-video');
const scene = byId('scene');
const status = byId('status');
const tapButton = byId('tap-button');
const cameraButton = byId('camera-button');
const resetButton = byId('reset-button');
const letter = byId('letter');
const trackingLabel = byId('tracking-label');
const hold = BirthdayGestures.createHold(340);
const handsBase = 'https://unpkg.com/@mediapipe/hands@0.4.1675469240/';
const phases = {
  ready: { gesture: 'pinch', prompt: '让拇指和食指碰在一起，稍停一下。', tap: '点击点亮', candle: '蜡烛未点亮' },
  lit: { gesture: 'victory', prompt: '许完愿，比个剪刀手，稍停一下。', tap: '许愿完毕，打开祝福', candle: '蜡烛已点亮' },
  celebrated: {},
};
let phase = 'ready';
let camera = null;
let handsLibrary = null;
let fireworkFrame = 0;

if (BirthdayCard.recipient) {
  byId('recipient').textContent = '给 ' + BirthdayCard.recipient;
  byId('recipient').hidden = false;
  document.title = BirthdayCard.recipient + '，生日快乐';
}
for (const line of BirthdayCard.greeting) {
  const paragraph = document.createElement('p');
  paragraph.textContent = line;
  byId('greeting').append(paragraph);
}
if (BirthdayCard.signature) {
  byId('signature').textContent = '—— ' + BirthdayCard.signature;
  byId('signature').hidden = false;
}

function showCamera(state) {
  byId('camera-badge').dataset.status = state;
  byId('camera-label').textContent = {
    idle: '手势未开启', loading: '正在开启手势', active: '手势已开启',
  }[state];
  byId('camera-action').textContent = {
    idle: '开启手势', loading: '取消开启', active: '关闭手势',
  }[state];
  byId('viewfinder').hidden = state !== 'active';
}

function showTracking(text, progress = 0) {
  trackingLabel.textContent = text;
  byId('gesture-progress').style.transform = 'scaleX(' + progress + ')';
}

function setPhase(next) {
  phase = next;
  document.body.dataset.phase = phase;
  byId('light-step').removeAttribute('aria-current');
  byId('wish-step').removeAttribute('aria-current');
  hold.update(null, performance.now());
  showTracking('等待手势');

  const complete = phase === 'celebrated';
  cameraButton.hidden = complete;
  tapButton.hidden = complete;
  resetButton.hidden = !complete;
  letter.hidden = !complete;

  if (complete) {
    stopCamera();
    status.textContent = '生日祝福已打开。';
    celebrate();
    const heading = byId('letter-title');
    heading.focus({ preventScroll: true });
    const bounds = scene.getBoundingClientRect();
    if (bounds.top < 0 || bounds.bottom > window.innerHeight) {
      scene.scrollIntoView({ block: 'nearest' });
    }
    return;
  }

  const current = phases[phase];
  byId(phase === 'ready' ? 'light-step' : 'wish-step').setAttribute('aria-current', 'step');
  tapButton.textContent = current.tap;
  byId('scene-state').lastChild.textContent = ' ' + current.candle;
  if (camera?.active) {
    status.textContent = current.prompt;
  } else if (!camera) {
    status.textContent = phase === 'ready' ? '也可以点击完成整张贺卡。' : '许个愿。准备好了，就拆开祝福。';
  }
}

function advance() {
  if (phase === 'ready') setPhase('lit');
  else if (phase === 'lit') setPhase('celebrated');
}

function handleHand(results, session) {
  if (camera !== session || !session.active) return;
  const points = results.multiHandLandmarks?.[0];
  const gesture = BirthdayGestures.classify(points);
  const expected = phases[phase].gesture;
  const { progress, complete } = hold.update(gesture === expected ? gesture : null, performance.now());
  showTracking(!points ? '把手放进画面' : progress > 0 ? '保持这个手势' : '已识别到手', progress);
  if (complete) advance();
}

function loadHands() {
  if (typeof window.Hands === 'function') return Promise.resolve(window.Hands);
  if (handsLibrary) return handsLibrary;

  handsLibrary = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = handsBase + 'hands.js';
    script.crossOrigin = 'anonymous';

    function fail() {
      clearTimeout(timer);
      script.remove();
      reject(new Error('Hand tracking library unavailable'));
    }

    const timer = setTimeout(fail, 15000);
    script.onerror = fail;
    script.onload = () => {
      clearTimeout(timer);
      if (typeof window.Hands === 'function') resolve(window.Hands);
      else fail();
    };
    document.head.append(script);
  }).catch((error) => {
    handsLibrary = null;
    throw error;
  });

  return handsLibrary;
}

function stopCamera(message) {
  const session = camera;
  camera = null;
  if (session) {
    cancelAnimationFrame(session.frame);
    clearTimeout(session.timer);
    session.stream?.getTracks().forEach((track) => track.stop());
    video.pause();
    video.srcObject = null;
    if (session.hands) {
      Promise.resolve(session.processing).catch(() => {}).then(() => session.hands.close()).catch(() => {});
    }
  }
  hold.update(null, performance.now());
  showCamera('idle');
  showTracking('等待手势');
  if (message) status.textContent = message;
}

function trackFrames(session) {
  let lastSent = 0;
  let lastVideoTime = -1;

  async function frame(now) {
    if (camera !== session) return;
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime && now - lastSent >= 46) {
      lastSent = now;
      lastVideoTime = video.currentTime;
      try {
        session.processing = session.hands.send({ image: video });
        await session.processing;
      } catch {
        if (camera === session) stopCamera('手势识别已中断，可以重试或点击继续。');
        return;
      } finally {
        session.processing = null;
      }
    }
    if (camera === session) session.frame = requestAnimationFrame(frame);
  }

  session.frame = requestAnimationFrame(frame);
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    status.textContent = '当前浏览器无法使用摄像头，可以直接点击继续。';
    return;
  }

  const session = {};
  camera = session;
  showCamera('loading');
  status.textContent = '请在浏览器弹窗中允许使用摄像头。';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 } },
    });
    if (camera !== session) {
      stream.getTracks().forEach((track) => track.stop());
      return;
    }
    session.stream = stream;
    stream.getVideoTracks()[0]?.addEventListener('ended', () => {
      if (camera === session) stopCamera('摄像头已断开，可以重试或点击继续。');
    });
    status.textContent = '正在加载手势识别，点击操作也可以继续。';
    session.timer = setTimeout(() => {
      if (camera === session) stopCamera('手势加载超时，可以重试或点击继续。');
    }, 25000);

    const Hands = await loadHands();
    if (camera !== session) return;
    const hands = new Hands({ locateFile: (file) => handsBase + file });
    session.hands = hands;
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: .55, minTrackingConfidence: .55 });
    hands.onResults((results) => handleHand(results, session));

    video.srcObject = stream;
    session.processing = hands.initialize();
    await Promise.all([session.processing, video.play()]);
    if (camera !== session) return;
    session.processing = null;
    session.active = true;
    clearTimeout(session.timer);
    showCamera('active');
    status.textContent = phases[phase].prompt;
    trackFrames(session);
  } catch (error) {
    if (camera !== session) return;
    const messages = {
      NotAllowedError: '摄像头未获授权，可以点击继续。',
      NotFoundError: '没有找到摄像头，可以点击继续。',
      NotReadableError: '摄像头可能正被占用，可以点击继续。',
    };
    stopCamera(messages[error.name] || '手势暂时无法开启，可以重试或点击继续。');
  }
}

function celebrate() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = byId('celebration');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const { width, height } = canvas.getBoundingClientRect();
  const scale = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * scale);
  canvas.height = Math.round(height * scale);
  ctx.scale(scale, scale);

  const palette = ['#b82a56', '#f898a9', '#ffe1a2', '#d87f52', '#fffaf0', '#b46b95'];
  const bursts = [
    { x: .5, y: .32, time: 0 },
    { x: .19, y: .38, time: 200 },
    { x: .82, y: .24, time: 370 },
    { x: .73, y: .56, time: 500 },
  ];
  const particles = bursts.flatMap(({ x, y, time }) => Array.from({ length: 24 }, (_, i) => {
    const angle = Math.random() * 2 * Math.PI;
    const speed = (38 + Math.random() * 135) * Math.min(width / 450, 1.3);
    return { x: x * width, y: y * height, time, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed - 34, color: palette[i % palette.length] };
  }));
  const start = performance.now();

  function draw(now) {
    ctx.clearRect(0, 0, width, height);
    for (const particle of particles) {
      const t = (now - start - particle.time) / 1000;
      if (t < 0 || t >= 1.25) continue;
      const x = particle.x + particle.dx * t;
      const y = particle.y + particle.dy * t + 55 * t * t;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * particle.dx * .07);
      ctx.globalAlpha = Math.min(1, (1.25 - t) * 2.4);
      ctx.fillStyle = particle.color;
      ctx.fillRect(-2.4, -1.4, 5.5, 3);
      ctx.restore();
    }
    if (now - start < 1760) fireworkFrame = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, width, height);
  }

  fireworkFrame = requestAnimationFrame(draw);
}

cameraButton.addEventListener('click', () => {
  if (camera) stopCamera('手势已关闭，可以点击继续。');
  else void startCamera();
});
tapButton.addEventListener('click', advance);
resetButton.addEventListener('click', () => {
  cancelAnimationFrame(fireworkFrame);
  const canvas = byId('celebration');
  canvas.getContext('2d')?.clearRect(0, 0, canvas.width, canvas.height);
  setPhase('ready');
  tapButton.focus({ preventScroll: true });
});
window.addEventListener('pagehide', () => stopCamera());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && camera) stopCamera('手势已暂停，返回后可重新开启。');
});
</script>
