<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="伸手聚拢星尘，点亮烛光，再放一场生日烟花。">
  <meta name="theme-color" content="#100d18">
  <title>为你点亮一颗星</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js"></script>
  <script defer src="gestures.js"></script>
  <script defer src="point-cloud.js"></script>
  <script defer src="particles.js"></script>
  <script defer src="sound.js"></script>
  <script defer src="blow.js"></script>
  <script defer src="card.js"></script>
</head>
<body data-phase="sealed">
  <div class="shell">
    <header class="topbar">
      <div class="mark"><span class="seal" aria-hidden="true">✧</span> 生日贺卡</div>
      <div class="top-actions">
        <button class="quiet-button" id="guide-button" type="button">玩法</button>
        <button class="sound-toggle" id="sound-toggle" type="button" aria-label="音效" aria-pressed="false"><span>音效关</span></button>
        <details class="sound-settings">
          <summary class="quiet-button">声音</summary>
          <div class="sound-panel">
            <label for="volume">音量</label>
            <input id="volume" type="range" min="0" max="100" step="1" value="35">
            <label for="music">背景音乐</label>
            <select id="music">
              <option value="off">关闭</option>
              <option value="music-box">星光八音盒</option>
              <option value="piano">烛光钢琴</option>
            </select>
          </div>
        </details>
      </div>
    </header>

    <main class="card-layout">
      <section class="intro" aria-labelledby="title">
        <h1 id="title">为你点亮<br><em>一颗星。</em></h1>

        <ol class="steps" id="steps" aria-label="贺卡进度">
          <li class="step" aria-current="step">点星</li>
          <li class="step">聚星</li>
          <li class="step">点烛</li>
          <li class="step">烟花</li>
          <li class="step">祝福</li>
        </ol>

        <div class="gesture-cue" id="gesture-cue">
          <span id="gesture-icon" class="gesture-icon" aria-hidden="true">✋</span>
          <div><strong id="gesture-title">点亮星星</strong><p id="gesture-detail">点一下画面，唤醒星光。</p></div>
        </div>
        <div class="controls">
          <button class="button primary" id="tap-button" type="button">点亮星星</button>
          <button class="button secondary" id="camera-button" type="button"><span class="camera-icon" aria-hidden="true"></span><span id="camera-action">开启手势</span></button>
          <button class="button secondary" id="mic-button" type="button" hidden>吹蜡烛</button>
          <details class="shortcuts" id="shortcuts">
            <summary class="quiet-button">快速体验</summary>
            <div class="quick-panel">
              <button type="button" data-jump="stars">点星</button>
              <button type="button" data-jump="ready">看蛋糕</button>
              <button type="button" data-jump="lit">点烛</button>
              <button type="button" data-jump="celebrated">看烟花</button>
              <button type="button" data-jump="letter">看祝福</button>
            </div>
          </details>
        </div>
        <p class="status" id="status" role="status"></p>
        <div class="mic-meter" id="mic-meter" hidden aria-hidden="true">
          <span>收音</span><div class="meter-track"><span id="mic-level"></span></div>
          <span>吹气</span><div class="meter-track"><span id="mic-progress"></span></div>
        </div>
        <noscript><p class="status">请启用 JavaScript 体验互动。</p></noscript>
      </section>

      <section class="scene" id="scene" aria-label="生日星尘、粒子蛋糕和烟花">
        <canvas id="point-cloud" aria-hidden="true"></canvas>
        <canvas id="particle-scene" tabindex="0" role="img" aria-label="三维粒子画面，可点击继续、拖动旋转或双指缩放。也可以用方向键旋转。"></canvas>
        <span class="orbit-hint" id="orbit-hint">拖动旋转</span>
        <button class="button secondary finale-skip" id="finale-skip" type="button" hidden>打开祝福</button>
        <div class="viewfinder" id="viewfinder" hidden>
          <div class="preview-frame">
            <video id="camera-video" autoplay muted playsinline aria-label="手势摄像头预览"></video>
            <div class="hand-box" id="hand-box" hidden aria-hidden="true"></div>
          </div>
          <span class="tracking-caption" id="tracking-label">等待手势</span>
          <div class="hold-track" aria-hidden="true"><div id="gesture-progress"></div></div>
        </div>
        <article class="letter" id="letter" aria-labelledby="letter-title" hidden>
          <h2 id="letter-title" tabindex="-1">生日快乐！</h2>
          <div id="greeting"></div>
          <p class="signature" id="signature" hidden></p>
        </article>
      </section>
    </main>

    <footer class="footnote"><span aria-hidden="true">✧</span> 摄像头画面和麦克风声音只在当前设备处理，不上传、不存储。也可全程点击。</footer>
  </div>

  <dialog class="intro-dialog" id="welcome-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <p id="dialog-copy"></p>
    <ol id="dialog-steps" hidden>
      <li>允许浏览器使用摄像头。</li>
      <li>把一只手放进取景框，张开手掌。</li>
      <li>保持片刻，进度填满就能聚星。</li>
    </ol>
    <div class="dialog-actions">
      <button class="button secondary" id="dialog-dismiss" type="button" autofocus>用点击体验</button>
      <button class="button primary" id="dialog-accept" type="button">开启手势</button>
    </div>
  </dialog>
</body>
</html>
